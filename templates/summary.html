{% extends "layout.html" %}

{% block body %}
{% include 'navbar.html' %}
<div class="container mt-5">

            <h3>Best Scores Achieved Subject-wise</h3>
            <img src="{{ url_for('static', filename='images/best_scores_bar_chart.png') }}" alt="Bar Chart" class="img-fluid">

            <h3>Total Quiz Attempts Subject-wise</h3>
            <img src="{{ url_for('static', filename='images/quiz_attempts_pie_chart.png') }}" alt="Pie Chart" class="img-fluid">
        </div>
    </div>
</div>
{% endblock %}
