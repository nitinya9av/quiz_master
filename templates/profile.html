{% extends 'layout.html' %}

{% block title %}
Profile
{% endblock %}

{% block style %}
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/profile.css') }}">
{% endblock %}

{% block body %}
    {% include 'navbar.html' %}
    <div class="container mt-4 px-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-end">
                <img src="https://api.dicebear.com/9.x/micah/svg?seed={{user.full_name}}" alt="{{user.full_name}}" class="rounded-circle" width="50">
                <h1 class="h3 mb-0">Hello {{user.full_name}}</h1>
            </div>
            <a href="{{ url_for('logout') }}" class="btn btn-danger">
                <i class="fas fa-sign-out-alt"></i> <span class="d-none d-md-inline">Logout</span>
            </a>
        </div>
    </div>
    <div class="d-flex flex-column align-items-center container mt-4">
        <div class="card shadow col-10 col-md-6 p-4">
            <div class="row">
                <form method="post">
                    <div class="form-group">
                        <div class="mb-3">
                            <label for="name">Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{user.full_name}}" required>
                        </div>
                        <div class="mb-3">
                            <label for="opassword">Current Password</label>
                            <input type="password" class="form-control" id="opassword" name="opassword" required>
                        </div>
                        <div class="mb-3">
                            <label for="password">New Password</label>
                            <input type="password" class="form-control" id="password" name="password">
                        </div>
                        <div class="mb-3">
                            <label for="cpassword">Confirm Password</label>
                            <input type="password" class="form-control" id="cpassword" name="cpassword">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i>
                        Save
                    </button>
                    <a href="{{ url_for('admin') }}" class="btn btn-danger">
                        <i class="fas fa-times"></i>
                        Cancel
                    </a>
                </form>
            </div>
        </div>
{% endblock %}
