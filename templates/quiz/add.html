{% extends 'layout.html' %}

{% block title %}
Add Quiz
{% endblock %}


{% block body %}
    {% include 'navbar.html' %}
    <h1 class="h1 text-center mt-5">Add New Quiz</h1>
    <div class="container shadow col-10 col-md-6 p-4 m-5 bg-white rounded">
        <div class="row">
            <form method="post">
                <div class="form-group">
                    <div class="mb-3">
                        <label for="chapter_id">Chapter ID</label>
                        <select class="form-select" id="chapter_id" name="chapter_id" required>
                            <option value="" selected disabled>Choose a chapter</option>
                            {% for chapter in chapters %}
                            <option value="{{ chapter.id }}">
                                {{ chapter.name }} (ID: {{ chapter.id }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="date">Quiz Date</label>
                        <input type="date" class="form-control" id="date" name="date" required>
                    </div>
                    <div class="mb-3">
                        <label for="duration">Quiz Duration</label>
                        <div class="input-group">
                            <input type="number" 
                                   class="form-control" 
                                   id="hours" 
                                   name="hours" 
                                   min="0" 
                                   placeholder="Hours"
                                   required>
                            <span class="input-group-text">hours</span>
                            <input type="number" 
                                   class="form-control" 
                                   id="minutes" 
                                   name="minutes" 
                                   min="0" 
                                   max="59"
                                   placeholder="Minutes"
                                   required>
                            <span class="input-group-text">mins</span>
                        </div>
                        <small class="form-text text-muted">Example: 1 hour 30 minutes</small>
                    </div>
                    <div class="mb-3">
                        <label for="description">Description</label>
                        <input type="text" class="form-control" id="description" name="description">
                    </div>                  
                </div>
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-plus"></i>
                    Add
                </button>
                <a href="{{ url_for('quiz') }}" class="btn btn-danger">
                    <i class="fas fa-times"></i>
                    Cancel
                </a>
            </form>
        </div>
    </div>
{% endblock %}
